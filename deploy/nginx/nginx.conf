# ============================================================================
# nginx — gateway applicativo km_engine (ADR-003 D2, WP-E1/GE1)
#
# Iterazione E: TLS abilitato sul gateway.
#   - 443 TLS (certificato self-signed in dev: scripts/gen_certs.sh)
#   - 80  -> redirect 301 a HTTPS
#   - HSTS attivo solo su HTTPS
# Ruoli: reverse proxy verso km-api (upstream DNS compose, load balance sulle
# repliche), rate limiting (piu' stretto su /auth, ADR-002 D5), header di
# sicurezza di base, limite dimensione body.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Rate limiting (ADR-003 D2) ---
    # zone per IP client; tuning empirico al load test G8
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- Upstream: DNS del compose risolve tutte le repliche km-api ---
    upstream km_api {
        server km-api:8000;
        keepalive 32;
    }

    # --- Redirect HTTP -> HTTPS (WP-E1) ---
    server {
        listen 80;
        server_name _;

        # Healthcheck del container nginx: risponde anche su HTTP per il check
        # locale del compose (wget --no-check-certificate su https e' usato in
        # alternativa; qui teniamo un path locale senza redirect).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- Gateway HTTPS (WP-E1) ---
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/km-engine.crt;
        ssl_certificate_key /etc/nginx/certs/km-engine.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Limite dimensione body (payload di ingestione)
        client_max_body_size 50m;

        # --- Header di sicurezza ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Healthcheck del container nginx (usato dal compose)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # --- /auth: rate limit stretto (protezione brute-force) ---
        location /auth/ {
            limit_req  zone=auth_limit burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://km_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # --- /api/v1: API pubblica ---
        location /api/v1/ {
            limit_req  zone=api_limit burst=40 nodelay;
            limit_conn conn_limit 50;
            proxy_pass http://km_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # Tutto il resto: 404 (nessuna UI nel MVP, Q13)
        location / {
            return 404;
        }
    }
}
