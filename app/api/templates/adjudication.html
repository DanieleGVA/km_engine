<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>km_engine — Adjudication UI</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { border-bottom: 2px solid #ccc; padding-bottom: .5rem; }
    h2 { margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { border: 1px solid #ddd; padding: .5rem; text-align: left; vertical-align: top; }
    th { background: #f5f5f5; }
    form { display: inline; }
    button { margin: .1rem; padding: .3rem .6rem; cursor: pointer; }
    .approve { background: #e6f4ea; }
    .reject { background: #fce8e6; }
    .error { background: #fce8e6; border: 1px solid #c00; padding: .75rem; margin: 1rem 0; }
    .empty { color: #666; }
  </style>
</head>
<body>
  <h1>km_engine — Adjudication UI</h1>
  <p>Code L3, proposte glossario e conflitti. Le azioni richiedono ruolo admin o editor.</p>
  {{ERROR}}

  <h2>Code L3 (adjudications)</h2>
  {{ADJUDICATIONS}}

  <h2>Proposte glossario</h2>
  {{PROPOSALS}}

  <h2>Conflitti</h2>
  {{CONFLICTS}}
</body>
</html>
