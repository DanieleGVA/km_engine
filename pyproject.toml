[project]
name = "km-engine"
version = "0.1.0"
description = "Enterprise knowledge management engine - replatforming of Graphify"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=25.1.0",
    "httpx>=0.28.1",
    "graphifyy",
    "httpx2>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.workspace]
members = [
    "graphify",
]

[tool.uv.sources]
graphifyy = { workspace = true }
