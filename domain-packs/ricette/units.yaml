# Regole di conversione/rinomina unità (P7: SI + unità culinarie canoniche).
# - factor: moltiplicatore da from_unit a to_unit.
# - rounding: null = esatto (nessun arrotondamento); 0 = intero; n>0 = n decimali.
# Le regole di identità/rinomina hanno factor 1.0 e rounding null (la quantità
# non viene toccata); la nota documenta l'equivalenza metrica.
- rule_id: UNIT-G
  from_unit: g
  to_unit: g
  factor: 1.0
  rounding: null
- rule_id: UNIT-KG
  from_unit: kg
  to_unit: kg
  factor: 1.0
  rounding: null
- rule_id: UNIT-ML
  from_unit: ml
  to_unit: ml
  factor: 1.0
  rounding: null
- rule_id: UNIT-L
  from_unit: l
  to_unit: l
  factor: 1.0
  rounding: null
- rule_id: UNIT-DL
  from_unit: dl
  to_unit: ml
  factor: 100.0
  rounding: 0
  note: 1 dl = 100 ml
- rule_id: UNIT-C
  from_unit: °C
  to_unit: °C
  factor: 1.0
  rounding: null
- rule_id: UNIT-MIN
  from_unit: min
  to_unit: min
  factor: 1.0
  rounding: null
- rule_id: UNIT-H
  from_unit: h
  to_unit: h
  factor: 1.0
  rounding: null
# ---------------------------------------------------------------------------
# Unita' culinarie (WP-F2). from_forms/to_forms sono la SOLA sorgente delle
# varianti accettate (plurali, abbreviazioni, sinonimi): prima le stesse
# tabelle vivevano duplicate e divergenti in pack._UNIT_PLURALS,
# verify.DEFAULT_KNOWN_UNITS e canonical._ITALIAN_PLURALS/_ENGLISH_PLURALS.
# countable: unita' di conteggio, mai convertita; da sola (es. "- 2 coste")
# il parser la tratta come ingrediente, non come unita'.
# ---------------------------------------------------------------------------
- rule_id: UNIT-TBSP
  from_unit: cucchiaio
  from_forms: [cucchiai]
  to_unit: tablespoon
  to_forms: [tablespoons, tbsp]
  factor: 1.0
  rounding: null
  note: 1 tablespoon = 15 ml
