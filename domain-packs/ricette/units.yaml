# Non regole di unita', per decisione presa sul corpus (WP-F2):
# - "noce": 7 righe su 7 sono ingrediente ("noci tritate", "noce di vitello"),
#   zero sono la dose "noce di burro". UNIT-KNOB sposterebbe l'ingrediente
#   dentro l'unita' e lo perderebbe.
# - "chiodo/chiodi": tutte le 15 righe sono "chiodi di garofano", che e' un
#   ingrediente intero; come unita' l'item diventerebbe "garofano".
#   Va risolto come voce di glossario (WP-F5).
# - "goccia/gocce": le 3 righe del corpus sono "gocce di cioccolato", cioe'
#   le gocce di cioccolato come ingrediente, non una dose in gocce.

# ---------------------------------------------------------------------------
# Passo 2 PROGRAMMA-UNICO: unita' di conteggio e forme industriali come regole
# IDENTITA' (from=to, factor 1.0, pattern UNIT-G): entrano in known_units() per
# il parser e canonicalize non le tocca. La conversione MKS (cl->ml, lt->l,
# mg->g) avviene SOLO in standardize_doses (passo 8), mai qui.
# Forme esatte per case: il parser del template e' case-sensitive.
# ---------------------------------------------------------------------------
- rule_id: UNIT-CL
  from_unit: cl
  to_unit: cl
  factor: 1.0
  rounding: null
  note: centilitro - identita' (conversione MKS in standardize_doses)
- rule_id: UNIT-LT
  from_unit: lt
  to_unit: lt
  factor: 1.0
  rounding: null
  note: litro (forma industriale) - identita'
- rule_id: UNIT-MG
